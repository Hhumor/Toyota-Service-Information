<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>丰田维修服务信息系统</title>
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link rel="stylesheet" type="text/css" href="system/css/global.css">
    <link rel="stylesheet" type="text/css" href="system/css/facebox.css">
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>丰田维修服务信息系统</h1>
            <button id="sidebar-toggle" class="sidebar-toggle" type="button">目录</button>
        </div>
        <div id="main">
            <div id="sidebar">
                <div id="sidebar-header">
                    <h2>目录导航</h2>
                </div>
                <div id="search-container">
                    <input type="text" id="search-input" placeholder="搜索目录..." autocomplete="off">
                    <button type="button" id="search-clear" class="search-clear hidden">&times;</button>
                    <div id="search-results" class="search-results hidden"></div>
                </div>
                <div id="tree-container">
                    <div id="loading">加载目录中...</div>
                </div>
            </div>
            <div id="content">
                <div id="content-welcome">
                    <div class="welcome-icon"></div>
                    <div class="welcome-text">欢迎使用丰田维修服务信息系统</div>
                    <div class="welcome-subtext">请从目录中选择一个项目以查看内容</div>
                </div>
                <div id="content-placeholder" class="content-placeholder hidden">
                    <div class="placeholder-icon"></div>
                    <div class="placeholder-text">加载中...</div>
                    <div class="placeholder-subtext">请稍候</div>
                </div>
                <iframe id="content-frame" name="content-frame" src="about:blank" frameborder="0"></iframe>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="system/js/toc-loader.js"></script>
</body>
</html>
