<h1>座椅&nbsp;&nbsp;座椅温度控制系统&nbsp;&nbsp;概述&nbsp;&nbsp;概述&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GN4Z_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">概要
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>根据车型不同，驾驶员和前排乘客座椅配备有座椅温度控制系统。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>通过使用鼓风机单元，座椅温度控制系统实现了前排座椅的舒适性。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>空调放大器总成控制鼓风机单元。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">d.</div>
<div class="step2Body">
<p>座椅加热器系统功能和座椅温度控制系统不能同时工作。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">e.</div>
<div class="step2Body">
<p>座椅温度控制系统仅使用车厢内的空气。不使用加热或冷却过的空气。
</p>
</div>
</div>
</div>
<br>
</div>
