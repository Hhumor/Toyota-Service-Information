<h1>A25A-FKS 排放控制系统&nbsp;&nbsp;燃油蒸汽排放控制系统（不带炭罐泵模块）&nbsp;&nbsp;概述&nbsp;&nbsp;概述&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GT57_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">概要
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>燃油蒸汽排放控制系统防止燃油箱总成内产生的燃油蒸汽直接排放到大气中。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>炭罐储存燃油箱总成内产生的燃油蒸汽。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>此系统包括清污 VSV、炭罐和 ECM。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">d.</div>
<div class="step2Body">
<p>根据驾驶条件，ECM 控制清污 VSV 以使燃油蒸汽进入发动机并燃烧。
</p>
</div>
</div>
</div>
<br>
