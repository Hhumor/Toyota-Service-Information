<h1>助力系统&nbsp;&nbsp;动力转向系统&nbsp;&nbsp;概述&nbsp;&nbsp;概述&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GZ29_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">概要
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>电动转向 (EPS) 系统使用内置于转向机壳内的动力转向电动机和减速机构产生辅助扭矩以辅助驾驶员的转向力矩。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>EPS 系统仅在需要扭矩辅助转向期间激活动力转向电动机。因此，直线行驶时 EPS 系统不消耗能量，从而实现了燃油经济性。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>EPS 系统与制动控制系统协同进行控制。动力转向 ECU 根据防滑控制 ECU 发送的辅助扭矩请求控制动力转向电动机的辅助扭矩。
</p>
</div>
</div>
</div>

</div>
