<h1>P710 混合动力变速器/传动桥&nbsp;&nbsp;混合动力传动桥系统&nbsp;&nbsp;详情&nbsp;&nbsp;甩油式润滑机构&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GV3G_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">构造
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>润滑系统采用了经由减速主动齿轮和集油箱的甩油式润滑方式。这种结构最大限度地减少了驱动油泵所需的驱动损失。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item step2HasFigure">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>集油箱暂时存储被抛甩的油液，并向齿轮系的不同部位供油。集油箱内设有油孔，可有效地向发电机 (MG1) 和电动机 (MG2) 供油。
</p>
