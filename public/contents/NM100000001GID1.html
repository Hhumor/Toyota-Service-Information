<h1>驻车制动系统&nbsp;&nbsp;电动驻车制动系统（HV 车型）&nbsp;&nbsp;详情&nbsp;&nbsp;驻车制动开关&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GID1_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">构造
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>通过开关操作锁止驻车制动器时，指示灯点亮。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>驻车制动锁止的情况下拉起电动驻车制动开关 5 秒或更长时间时，自动功能启用。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>驻车制动解除的情况下按下电动驻车制动开关 5 秒或更长时间时，自动功能停用。
</p>
</div>
</div>
</div>
<br>
