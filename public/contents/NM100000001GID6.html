<h1>驻车制动系统&nbsp;&nbsp;电动驻车制动系统（汽油车型）&nbsp;&nbsp;概述&nbsp;&nbsp;概述&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GID6_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">概要
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>采用电动驻车制动系统。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>该系统具有手动功能，通过驾驶员开关操作即可操作驻车制动器，同时具有自动功能，可使驻车制动器结合换档杆位置进行操作。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>该系统可通过执行器操作驻车制动器，通过使用自动功能，不仅可减少操作力，而且还提高了便利性。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">d.</div>
<div class="step2Body">
<p>配备有与制动保持功能协同操作锁止驻车制动器的功能。有关详情，请参考制动控制/动态控制系统。
</p>
</div>
</div>
</div>
<br>
</div>
