<h1>座椅&nbsp;&nbsp;座椅总成&nbsp;&nbsp;概述&nbsp;&nbsp;概述&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GN53_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">概要
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>根据车辆规格，驾驶员座椅采用了 6 向手动座椅或 8 向电动座椅。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>根据车辆规格，乘客座椅采用了 4 向手动座椅或 4 向、8 向电动座椅。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>根据车辆规格，前排座椅采用电动腰部支撑。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">d.</div>
<div class="step2Body">
<p>后排座椅采用了儿童约束系统 (CRS)。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item step2HasFigure">
<div class="step2Head">e.</div>
<div class="step2Body">
<p>根据车辆规格，后排座椅采用固定座椅、可折叠 60/40 手动座椅或电动座椅。
</p>
