<h1>转向柱&nbsp;&nbsp;加热式方向盘系统&nbsp;&nbsp;概述&nbsp;&nbsp;概述&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001GZ2L_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">概要
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>根据车型，配备加热式方向盘系统。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>此系统包括加热器元件、2 个节温器（位于方向盘内）和一个方向盘加热器开关（包括一个指示灯）。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>通过操作方向盘加热器开关，此系统可使方向盘表面保持在指定温度，从而提高驾乘舒适性。
</p>
</div>
</div>
</div>
<br>
