<h1>门锁&nbsp;&nbsp;遥控门锁控制系统&nbsp;&nbsp;概述&nbsp;&nbsp;概述&nbsp;&nbsp;</h1>
<br>
<div id="NM100000001H3YY_z0" class="category no00">
<div class="content5">
<div class="step1">
<p class="step1"><span class="titleText">概要
</span></p>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">a.</div>
<div class="step2Body">
<p>遥控门锁控制系统便于远距离锁止和解锁所有车门。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">b.</div>
<div class="step2Body">
<p>在此系统中，电子钥匙和轮胎压力监控系统接收器总成执行代码识别处理，主车身 ECU 执行门锁控制。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">c.</div>
<div class="step2Body">
<p>采用电子钥匙发射器分总成，并且其包括 3 个按钮：锁止按钮、解锁按钮和行李箱门开启按钮。
</p>
</div>
</div>
</div>
<br>
<div class="step2">
<div class="step2Item">
<div class="step2Head">d.</div>
<div class="step2Body">
<p>准备用一个新的电子钥匙发射器分总成更换已丢失的发射器时，需要注册识别码。有关详情，请参考修理手册。
</p>
</div>
</div>
</div>
<br>
